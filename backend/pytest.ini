[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scratch .venv .git node_modules dist

markers =
    unit: Fast isolated unit tests
    integration: Integration tests for API routes and database layer
    e2e: End-to-end workflow placement pipeline tests
    security: Authentication, RBAC, and input validation tests
    rbac: Role-based access control authorization tests

addopts = -v --strict-markers -W ignore::DeprecationWarning
